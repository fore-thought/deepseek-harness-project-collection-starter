# 组级（用户级）配置模板 —— 复制为 user-config.toml 后由用户填写（user-config.toml 不入库）
# 规则：组级 AGENTS.md §6「配置读取优先级」——项目配置优先，未配置读本文件，再没有则卡片提示用户。
[git]
user_name = "<你的 git 用户名>"
user_email = "<你的 git 邮箱>"

[runtime]
# 本机运行系统（机器级默认，全组项目共用）→ 决定对话回复中给用户的路径格式
# （组级 AGENTS.md §0）。首个会话由代理判定 + 卡片确认后填写，此后直接读档不再判断；
# 个别项目从不同系统入口打开时，在项目 project-config.toml 的 [runtime] 覆盖。
# 可选值：windows = 盘符+反斜杠（C:\...）；posix = 斜杠路径（/mnt/... 等）
path_style = ""
